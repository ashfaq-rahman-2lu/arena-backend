name: Backend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          {
            POSTGRES_USER: arena,
            POSTGRES_PASSWORD: arena,
            POSTGRES_DB: arena_test,
          }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U arena" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://arena:arena@127.0.0.1:5432/arena_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run test:tooling
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run openapi
      - run: git diff --exit-code openapi.json
      - uses: actions/upload-artifact@v4
        with: { name: arena-openapi, path: openapi.json }
      - run: docker build -t arena-backend:check .
