services:
  db:
    image: postgres:16-alpine
    environment:
      { POSTGRES_USER: arena, POSTGRES_PASSWORD: arena, POSTGRES_DB: arena }
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["arena-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://arena:arena@db:5432/arena
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: development
      HOST: 0.0.0.0
      COOKIE_SECURE: "false"
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db: { condition: service_healthy }
      mailpit: { condition: service_started }
volumes:
  arena-db:
